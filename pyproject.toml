[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "alphaengine"
dynamic = ["version"]
description = "Validated research tooling for investment strategies: deflation, overfitting detection, and honest trial counts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "QuantOS" }]
keywords = [
    "quantitative-finance",
    "backtesting",
    "overfitting",
    "deflated-sharpe",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

# TWO DEPENDENCIES, AND THAT NUMBER IS A DESIGN CONSTRAINT.
# Both are already present in every quant environment we target, so installing
# this adds nothing new to anyone's lockfile. Most supply-chain risk arrives
# through dependency count, and every addition here is a conversation with
# somebody's security team. Do not add a third without a hard reason.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Factor decomposition (OLS with HAC errors) and cointegration (ADF) need
# statsmodels, which pulls pandas and patsy behind it. Kept OUT of the core so
# the headline install stays at two dependencies — the sweep and the whole
# validation path are numpy/scipy only and do not touch these.
factors = [
    "statsmodels>=0.14",
]
# The agent driver. Optional because `import alphaengine` must never require a
# model client, a key, or a network call — a researcher who wants a deflated
# Sharpe should not need an LLM dependency to get one.
agents = [
    "anthropic>=0.40",
]
# Pulling data from a provider the customer already pays for.
connectors = [
    "httpx>=0.27",
    "pyarrow>=15.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # PINNED, not floored. A range here means CI can pick up a new lint release
    # on any given day and fail a build that passed yesterday with no change
    # from us. Bump these deliberately.
    "ruff==0.16.1",
    "mypy==2.3.0",
    # The optional extra is installed for development so CI actually exercises
    # and type-checks the factors/pairs path instead of skipping it. Without
    # this, mypy cannot resolve statsmodels in a clean environment even though
    # it resolves fine on a machine that happens to have it.
    "statsmodels>=0.14",
]

[project.urls]
Homepage = "https://github.com/quantOSC/alphaengine"
Documentation = "https://github.com/quantOSC/alphaengine#readme"
Source = "https://github.com/quantOSC/alphaengine"
Issues = "https://github.com/quantOSC/alphaengine/issues"

[tool.hatch.version]
path = "src/alphaengine/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "golden: pins a computed value that is a public contract; changing it needs a major version bump",
]

[tool.ruff]
# 110 rather than the more common 100. The core modules were ported from the
# platform, where they were written at this width, and reflowing ~40 lines of
# dense numerical code by hand to satisfy a style preference is a real chance
# of introducing an error for no benefit. New code should still aim at 100.
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The core modules were ported from the platform, where they were written at a
# wider margin and with a different style config. Reflowing dense numerical code
# by hand to satisfy a line-length rule is a real chance of introducing an error
# in exchange for nothing, so the long lines there are left alone.
#
# This is scoped deliberately: sweep/, study/ and everything written from here
# are held to the full rule set, and none of them needed an exemption.
"src/alphaengine/core/*.py" = ["E501", "SIM108"]

[tool.mypy]
# python_version is deliberately NOT set.
#
# Pinning it to "3.10" while CI runs mypy on a 3.12 interpreter breaks the
# build in a way that has nothing to do with our code: numpy's bundled stubs
# use PEP 695 `type X = ...`, which is 3.12+ syntax, and a checker targeting
# 3.10 refuses to parse them. It fails before reaching src/ at all.
#
# Leaving it unset makes mypy use the interpreter it is running on, which is
# also the interpreter whose installed stubs it is reading. Those two should
# never disagree.
#
# We do not lose 3.10 coverage: the pytest matrix runs on 3.10 (and on
# numpy<2), requires-python declares the floor, and ruff's target-version =
# "py310" catches syntax and idioms that would not run there.
strict = true
warn_unreachable = true

# The core modules were ported from a codebase that never ran a type checker.
# Bringing ~3000 lines of numerical code to strict compliance is real work with
# no behavioural payoff, and doing it in the same change that publishes the
# package would bury everything else. Excluded for now, deliberately and
# visibly, rather than by weakening `strict` for the whole project.
#
# Everything written from here (sweep, study, and what follows) IS strict, and
# none of it needed an exemption. Typing the core is its own task.
[[tool.mypy.overrides]]
module = "alphaengine.core.*"
ignore_errors = true

# scipy and statsmodels ship no type information. Under `strict` an unresolved
# import is an error, so this is the difference between a build that passes on a
# machine that happens to have them and one that passes anywhere.
[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*"]
ignore_missing_imports = true
