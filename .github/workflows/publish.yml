name: publish

# Publishes to PyPI on a version tag.
#
# TRUSTED PUBLISHING VIA OIDC — there is no API token anywhere in this repo or
# in its secrets. GitHub mints a short-lived identity token that PyPI verifies
# against a publisher it has on record for this repo, workflow and environment.
# A long-lived PyPI token is the standard way a package gets hijacked; this
# removes the credential rather than protecting it.
#
# One-time PyPI setup (do this BEFORE the first tag):
#   PyPI -> the project -> Publishing -> Add a new pending publisher
#     owner:        quantOSC
#     repository:   alphaengine
#     workflow:     publish.yml
#     environment:  pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build once, publish that exact artifact. Building inside the publish job
  # would make the tested artifact and the shipped artifact different objects.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify git tag matches __version__
        run: |
          python scripts/check_version_sync.py
      # A TAG IS NOT A TEST RUN. Without this gate a tag on a commit CI never
      # saw (or saw fail) ships straight to PyPI. Same checks as ci.yml's lint
      # and goldens jobs, on the exact tree being built.
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python scripts/check_engine_version.py
      - run: python scripts/check_public_boundary.py
      - run: python scripts/check_no_engine_copies.py
      - run: pytest -q
      - run: pytest tests -m golden -q
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token. the only credential involved.
    # The repository allows GitHub-owned actions only, so the third-party
    # pypa/gh-action-pypi-publish action cannot run here (startup_failure).
    # This is PyPI's documented manual Trusted Publishing flow: exchange the
    # job's OIDC token for a short-lived upload token, then upload with twine.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade twine
      - run: python -m twine check dist/*
      - name: Mint a short-lived PyPI token via OIDC
        shell: python
        run: |
          import json, os, urllib.request

          req = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=pypi",
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              oidc = json.load(resp)["value"]

          mint = urllib.request.Request(
              "https://pypi.org/_/oidc/mint-token",
              data=json.dumps({"token": oidc}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(mint, timeout=30) as resp:
              token = json.load(resp)["token"]

          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write("TWINE_USERNAME=__token__\n")
              fh.write(f"TWINE_PASSWORD={token}\n")
      - run: python -m twine upload --non-interactive dist/*
