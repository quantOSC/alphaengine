name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        # The numpy 2.0 ABI break is real and quant environments are split
        # across it for a while yet. Test the floor of what we support on one
        # runner so a 1.x-only user is not our first bug report.
        include:
          - os: ubuntu-latest
            python: "3.10"
            numpy: "numpy<2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - if: matrix.numpy
        run: pip install "${{ matrix.numpy }}"
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      # THE FIFTH COPY GUARD. The command list lived in three hand-maintained
      # places and none of them agreed: `--data` and `--universe` shipped and
      # appeared in one. It is generated from `commands.py` now, and this fails
      # the build when the README falls behind rather than letting a stale list
      # quietly tell somebody a feature does not exist.
      - run: python scripts/gen_docs.py --check

  # The numbers this library returns are a public contract once published: a
  # study written today has to reproduce in two years. This job exists to make
  # a silent change to a computed value impossible — if a golden moves, the
  # build fails and the change has to be argued for in the PR and carried by a
  # major version bump.
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests -m golden -q
